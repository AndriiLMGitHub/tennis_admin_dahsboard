services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tennis_admin_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DEBUG: "${DEBUG:-False}"
      DATABASE_URL: "postgres://${POSTGRES_USER:-tennis}:${POSTGRES_PASSWORD:-tennis}@db:5432/${POSTGRES_DB:-tennis_admin}"
      CELERY_BROKER_URL: "${CELERY_BROKER_URL:-redis://redis:6379/0}"
      CELERY_RESULT_BACKEND: "${CELERY_RESULT_BACKEND:-redis://redis:6379/0}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}"
      CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}"
      RUN_MIGRATIONS: "true"
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tennis_admin_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DEBUG: "${DEBUG:-False}"
      DATABASE_URL: "postgres://${POSTGRES_USER:-tennis}:${POSTGRES_PASSWORD:-tennis}@db:5432/${POSTGRES_DB:-tennis_admin}"
      CELERY_BROKER_URL: "${CELERY_BROKER_URL:-redis://redis:6379/0}"
      CELERY_RESULT_BACKEND: "${CELERY_RESULT_BACKEND:-redis://redis:6379/0}"
      RUN_MIGRATIONS: "false"
    command: ["celery", "-A", "config", "worker", "--loglevel=info"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tennis_admin_beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DEBUG: "${DEBUG:-False}"
      DATABASE_URL: "postgres://${POSTGRES_USER:-tennis}:${POSTGRES_PASSWORD:-tennis}@db:5432/${POSTGRES_DB:-tennis_admin}"
      CELERY_BROKER_URL: "${CELERY_BROKER_URL:-redis://redis:6379/0}"
      CELERY_RESULT_BACKEND: "${CELERY_RESULT_BACKEND:-redis://redis:6379/0}"
      RUN_MIGRATIONS: "false"
    command: ["celery", "-A", "config", "beat", "--loglevel=info", "--schedule=/var/run/celery/celerybeat-schedule"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - celery_beat_data:/var/run/celery

  db:
    image: postgres:17-alpine
    container_name: tennis_admin_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-tennis_admin}"
      POSTGRES_USER: "${POSTGRES_USER:-tennis}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-tennis}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tennis_admin_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  celery_beat_data: