{# dashboard/student/profile/_stat_card.html #}
<div class="border border-gray-300 border-dashed rounded min-w-125px py-3 px-4 me-6 mb-3">
    <div class="d-flex align-items-center">
        <i class="ki-outline ki-{{ icon }} fs-3 text-{{ color }} me-2"></i>
        <div class="fs-2 fw-bold"
             data-kt-countup="true"
             data-kt-countup-value="{{ value }}"
             {% if prefix %}data-kt-countup-prefix="{{ prefix }}"{% endif %}>0</div>
    </div>
    <div class="fw-semibold fs-6 text-gray-500">{{ label }}</div>
</div>
